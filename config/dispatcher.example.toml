# sol-claude-dispatcher — example configuration
#
# Copy to config/dispatcher.toml and edit. The dispatcher FAILS CLOSED: an
# unknown key, a missing required section, a nonexistent repository root, or
# the untouched "/CONFIGURE/ME" placeholder below will all refuse to load.
# That is intentional — an unconfigured dispatcher must not dispatch.

[dispatcher]
state_dir = "./state"
default_timeout_seconds = 1800
max_timeout_seconds = 3600
default_max_turns = 40
default_max_resume_count = 4

# Model identifiers live here and nowhere else in the codebase.
# The Claude CLI accepts aliases ("sonnet") and full ids
# ("claude-sonnet-4-5"), so exact versions can be pinned later without a
# code change.
[models]
sonnet = "sonnet"
opus = "opus"
fable = "fable"

# Spend cap note (there is deliberately no budget key here). A per-run dollar
# cap comes from the task envelope's ``execution.max_budget_usd`` and defaults
# to unset, in which case ``--max-budget-usd`` is not emitted at all and no
# dispatcher-side cap applies. If a caller does set one, be aware the Fable
# review reuses the same value: a one-word Fable turn was measured at $0.39
# during commissioning (vs $0.11 for Sonnet — ~18.8k cache-creation tokens for
# the system prompt alone), and a real review adds the reviewer policy, the
# schema and file reads. A budget sized for a cheap worker turn (~$0.50 or
# less) will kill the review mid-flight and look like a Fable failure.

[routing]
# Must be "sonnet" or "opus". Fable is a reviewer and can never be the
# default implementation worker.
default_model = "sonnet"

[security]
max_dispatch_depth = 1
allow_network = false

# The next four CANNOT be enabled. Setting any of them to true is REFUSED at
# load time, not silently coerced: the operations they name are prohibited by
# code-level invariants (runner.CORE_DENIED_GIT_OPERATIONS and the invocation
# sanity check), which no configuration flag can influence. They are kept as
# keys only so existing configs and stored envelopes still parse.
allow_push = false
allow_merge = false
allow_commit = false
allow_subagents = false

# REQUIRED. Repositories the dispatcher will accept work for, as absolute
# paths. Each must exist, be a directory, and be a repository's OWN git top
# level — listing a parent directory does NOT authorise the repositories
# inside it, and dispatching against a subdirectory of an allowed repository
# is refused (use [scope].allowed_paths in the task to narrow the work).
# A linked git worktree is its own top level and needs its own entry.
# "/" is rejected outright — do not seed broad filesystem access. Keep this
# list as narrow as possible.
allowed_repository_roots = [
    "/CONFIGURE/ME",
]

[validation]
# Re-run the envelope's trusted validation commands after the worker exits
# and record the dispatcher's own result alongside the worker's claims.
run_dispatcher_validation = true

[claude]
# Resolved on PATH unless an absolute path is given.
binary = "claude"

# One of: acceptEdits, auto, manual, dontAsk, plan.
# "bypassPermissions" is deliberately not offered by this dispatcher.
permission_mode = "auto"

worker_policy_path = "./prompts/worker-policy.md"
fable_policy_path = "./prompts/fable-reviewer-policy.md"
empty_mcp_config_path = "./config/empty-mcp.json"
worker_result_schema_path = "./schemas/worker-result.schema.json"
fable_review_schema_path = "./schemas/fable-review.schema.json"

# Built-in tools granted to an implementation worker. Note what is absent:
# Agent/Task (no subagents), WebFetch, WebSearch.
worker_tools = [
    "Bash",
    "Read",
    "Write",
    "Edit",
    "Glob",
    "Grep",
    "TodoWrite",
    "NotebookEdit",
]

# Fable is read-only. No Edit, no Write, no Bash.
reviewer_tools = ["Read", "Glob", "Grep"]

# Deny patterns applied on top of the tool list. This list is ADDITIVE ONLY:
# runner.ALWAYS_DISALLOWED_TOOLS (mcp__*, Agent, Task, Bash(claude:*),
# Bash(codex:*), Bash(gh:*)) and runner.CORE_DENIED_GIT_OPERATIONS (the eight
# git operations below) are appended unconditionally, so deleting an entry here
# removes nothing — emptying this list entirely changes no prohibition. Add
# your own patterns; you cannot subtract these.
#
# Honesty (docs/SECURITY.md): a deny pattern is a prefix match on Bash command
# TEXT performed by the Claude CLI's permission engine. It is not an OS
# boundary and does not resolve the executable. What actually detects a
# prohibited mutation is the post-run evidence.
disallowed_tools = [
    "mcp__*",
    "Bash(git push:*)",
    "Bash(git merge:*)",
    "Bash(git rebase:*)",
    "Bash(git commit:*)",
    "Bash(git reset:*)",
    "Bash(git clean:*)",
    "Bash(git worktree:*)",
    "Bash(claude:*)",
    "Bash(codex:*)",
    # Gate 4.5 P1/P2. Also non-configurable in runner.py; mirrored here because
    # the skill projection engine refuses to project guidance that instructs an
    # operation the effective deny list does not cover.
    "Bash(git bisect:*)",
    "Bash(gh:*)",
]

# Approved-skill projection (GATE 4.5). The dispatcher appends *inert text*
# extracted from explicitly approved, hash-pinned skill files to the worker's
# system prompt. It never loads the native Claude Skill runtime, never grants
# the "Skill" tool, and never trusts a plugin, a directory, or a path family:
# every projectable skill is an explicit entry in the manifest below.
[skills]
# GATE 4.5 lane F: projection is now WIRED into the real dispatch and resume
# paths, so this flag is live rather than decorative. It stays FALSE until the
# §18 disposable live adversarial gate passes — Sol turns it on deliberately,
# and turning it on is a configuration change only, never a code change.
enabled = false

# Only "projected" exists. "native" is refused at load time — approving a
# SKILL.md hash does not approve the plugin runtime, hooks, subagents or MCP
# servers that ship beside it.
mode = "projected"

# Cannot be disabled. A changed hash, a missing file or a moved path means the
# approved text is no longer what was reviewed, so projection refuses rather
# than silently accepting a new hash.
fail_on_drift = true

# Fail-closed cap on the total projected payload. The measured deterministic
# worst case (large_refactor + critical risk + high complexity + resume, with
# co-projected supporting files) is ~105 KB; anything above the cap refuses
# rather than truncating reviewed guidance mid-sentence.
max_projected_bytes = 120000

# The reviewed, source-controlled approval manifest. Never auto-rewritten:
# drift is a human/Sol reapproval decision.
manifest_path = "./config/approved-skills.json"

# Curated project-guidance projection (GATE 4.5 addendum). The worker runs
# under --safe-mode, so native CLAUDE.md / AGENTS.md auto-loading is OFF.
# Instead the dispatcher emits reviewed, hash-pinned curated projections
# selected by repository-relative allowed_paths.
[project_guidance]
enabled = false

# Only "projected" exists. Native CLAUDE.md loading is refused at load time:
# the root documents mix safe engineering context with production operator
# procedures and credential locations, and approving a repository does not
# approve everything its instruction files instruct.
mode = "projected"

# Cannot be disabled. A changed instruction-source hash means the curated
# projection derived from it is no longer what was reviewed, so projection
# refuses and Sol reapproves rather than the dispatcher silently rebuilding.
fail_on_drift = true

# Fail-closed cap on the total projected guidance payload. The measured worst
# legitimate cross-scope shape (curated root + the two largest approved
# subproject projections + the graph-refresh clause) is ~41 KB.
max_projected_bytes = 60000

# The reviewed, source-controlled approval manifest. Never auto-rewritten:
# drift is a human/Sol reapproval decision. Nothing projects while its
# approval.state is not "APPROVED".
manifest_path = "./config/approved-guidance.json"

[logging]
# Logs go to stderr or a file — NEVER stdout, which belongs to the MCP
# stdio transport.
level = "INFO"
# log_file = "./logs/dispatcher.log"
